<ion-content class="secret-key-setup">
    <div class="secret-key-container">
        <div class="logo-container">
            <ion-img src="assets/img/bs23_logo.png" alt="Logo"></ion-img>
        </div>

        <div class="content-wrapper">
            <h1 class="title">Welcome</h1>
            <p class="subtitle">Please enter your organization's secret key to configure this app</p>

            <form (ngSubmit)="submit()" class="secret-key-form">
                <ion-item class="secret-key-input">
                    <ion-label position="floating">Secret Key</ion-label>
                    <br>
                    <ion-input
                        [(ngModel)]="secretKey"
                        name="secretKey"
                        type="text"
                        placeholder="Enter your secret key"
                        [disabled]="loading"
                        required
                    ></ion-input>
                </ion-item>

                <ion-button
                    expand="block"
                    type="submit"
                    [disabled]="loading || !secretKey.trim()"
                    class="submit-button"
                >
                    <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
                    <span *ngIf="!loading" >Activate</span>
                </ion-button>
            </form>

            <div class="help-text">
                <p>Don't have a secret key? Contact your organization administrator.</p>
            </div>
        </div>
    </div>
</ion-content>
